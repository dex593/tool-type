name: Build ToolType

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows MinGW build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        shell: pwsh
        env:
          TOOLTYPE_FULL_STATIC: "1"
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Show SHA256
        shell: pwsh
        run: Get-FileHash .\ToolType.exe -Algorithm SHA256 | Format-List

      - name: Check runtime DLL dependencies
        shell: pwsh
        run: |
          $dump = & objdump -p .\ToolType.exe
          $dlls = $dump | Select-String 'DLL Name:' | ForEach-Object { $_.Line.Trim() }
          $dlls
          $unexpected = $dlls | Where-Object { $_ -match 'lib(winpthread|gcc|stdc\+\+)|zlib|libz' }
          if ($unexpected) {
            throw "Executable still depends on MinGW runtime DLLs: $($unexpected -join ', ')"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ToolType-windows
          path: |
            ToolType.exe
            check.ini
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $versionLine = Get-Content .\check.ini | Where-Object { $_ -match '^\s*version\s*=' } | Select-Object -First 1
          if (-not $versionLine) {
            throw "Khong tim thay version trong check.ini"
          }
          $version = ($versionLine -replace '^\s*version\s*=\s*', '').Trim()
          if (-not $version) {
            throw "Version trong check.ini dang trong"
          }

          $tag = "v$version"
          $sha256 = (Get-FileHash .\ToolType.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesPath = "release-notes.md"

          @"
          ## ToolType $version

          Bản phát hành tự động từ GitHub Actions sau khi build Windows MinGW thành công.

          ### Tải xuống

          - `ToolType.exe` — bản chạy Windows mới nhất.
          - `check.ini` — file cấu hình cập nhật công khai cho cơ chế auto-check.

          ### Xác minh

          - SHA256 (`ToolType.exe`): `$sha256`
          - Commit: `$env:GITHUB_SHA`

          ### Ghi chú vận hành

          ToolType kiểm tra `check.ini` trên nhánh `master`. Khi cần phát hành phiên bản mới,
          hãy bump `version` trong `check.ini` và metadata trong code/resource trước khi build.
          "@ | Set-Content -Path $notesPath -Encoding UTF8

          & gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $tag .\ToolType.exe .\check.ini --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload release assets failed" }
            & gh release edit $tag --title "ToolType $version" --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw "Update release metadata failed" }
          } else {
            & gh release create $tag .\ToolType.exe .\check.ini --target $env:GITHUB_SHA --title "ToolType $version" --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw "Create release failed" }
          }
