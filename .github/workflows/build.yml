name: Build ToolType

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows MinGW build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        shell: pwsh
        env:
          TOOLTYPE_FULL_STATIC: "1"
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Show SHA256
        shell: pwsh
        run: Get-FileHash .\ToolType.exe -Algorithm SHA256 | Format-List

      - name: Check runtime DLL dependencies
        shell: pwsh
        run: |
          $dump = & objdump -p .\ToolType.exe
          $dlls = $dump | Select-String 'DLL Name:' | ForEach-Object { $_.Line.Trim() }
          $dlls
          $unexpected = $dlls | Where-Object { $_ -match 'lib(winpthread|gcc|stdc\+\+)|zlib|libz' }
          if ($unexpected) {
            throw "Executable still depends on MinGW runtime DLLs: $($unexpected -join ', ')"
          }

      - name: Package release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\ToolType.exe -DestinationPath .\ToolType.zip -Force

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: ToolType-windows
          path: ToolType.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $versionLine = Get-Content .\check.ini | Where-Object { $_ -match '^\s*version\s*=' } | Select-Object -First 1
          if (-not $versionLine) {
            throw "Khong tim thay version trong check.ini"
          }
          $version = ($versionLine -replace '^\s*version\s*=\s*', '').Trim()
          if (-not $version) {
            throw "Version trong check.ini dang trong"
          }

          $tag = "v$version"
          $zipPath = ".\ToolType.zip"
          if (-not (Test-Path $zipPath)) {
            throw "Khong tim thay ToolType.zip"
          }
          $notesPath = "release-notes.md"

          @"
          ## ToolType $version

          Bản phát hành tự động từ GitHub Actions sau khi build Windows MinGW thành công.

          ### Tải xuống

          - Tải `ToolType.zip`, giải nén rồi chạy `ToolType.exe`.
          "@ | Set-Content -Path $notesPath -Encoding UTF8

          & gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $existingAssets = @(& gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Read release assets failed" }
            foreach ($oldAsset in @("ToolType.exe", "check.ini")) {
              if ($existingAssets -contains $oldAsset) {
                & gh release delete-asset $tag $oldAsset --yes
                if ($LASTEXITCODE -ne 0) { throw "Delete old release asset failed: $oldAsset" }
              }
            }
            & gh release upload $tag $zipPath --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload release assets failed" }
            & gh release edit $tag --title "ToolType $version" --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw "Update release metadata failed" }
          } else {
            & gh release create $tag $zipPath --target $env:GITHUB_SHA --title "ToolType $version" --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw "Create release failed" }
          }
